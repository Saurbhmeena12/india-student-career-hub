name: Deploy static frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble static site
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          set -eu
          rm -rf dist
          mkdir -p dist/css dist/js dist/pages
          cp index.html admin.html favicon.svg manifest.json robots.txt sitemap.xml dist/
          cp style.css dist/css/style.css
          cp icons.js i18n.js topbar.js site.js cards.js widgets.js app.js api-base.js dist/js/
          for file in *.html; do
            case "$file" in
              index.html|admin.html) continue ;;
              *) cp "$file" "dist/pages/$file" ;;
            esac
          done
          printf 'window.__API_BASE__ = %s;\n' "$(python3 -c 'import json, os; print(json.dumps(os.environ.get("API_BASE_URL", "")))')" > dist/js/config.js
          touch dist/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
